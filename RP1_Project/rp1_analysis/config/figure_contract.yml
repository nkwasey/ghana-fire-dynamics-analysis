schema_version: rp1-analysis-v1.1
formats:
  raster:
  - png
  vector:
  - pdf
resolution_dpi: 300
dimensions_inches:
  single_panel:
  - 7.0
  - 5.0
  wide_single_panel:
  - 7.2
  - 6.0
  full_width_map:
  - 7.2
  - 7.2
physical_size_roles:
  rectangular_landscape_20x15_cm:
    width_cm: 20.0
    height_cm: 15.0
  portrait_10x15_cm:
    width_cm: 10.0
    height_cm: 15.0
pixel_rounding:
  method: half_up
grid_layouts:
  single_panel:
    rows: 1
    columns: 1
    width_ratios:
    - 1.0
    height_ratios:
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 1
    size_role: single_panel
  wide_single_panel:
    rows: 1
    columns: 1
    width_ratios:
    - 1.0
    height_ratios:
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 1
    size_role: wide_single_panel
  full_width_map:
    rows: 1
    columns: 1
    width_ratios:
    - 1.0
    height_ratios:
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 1
    size_role: full_width_map
  rectangular_one_by_two:
    rows: 1
    columns: 2
    width_ratios:
    - 1.0
    - 1.0
    height_ratios:
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 1
      row: 0
      column: 1
      row_span: 1
      column_span: 1
    size_role: rectangular_landscape_20x15_cm
  rectangular_top_span_two_bottom:
    rows: 2
    columns: 2
    width_ratios:
    - 1.0
    - 1.0
    height_ratios:
    - 1.0
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 2
    - kind: data
      panel_index: 1
      row: 1
      column: 0
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 2
      row: 1
      column: 1
      row_span: 1
      column_span: 1
    size_role: rectangular_landscape_20x15_cm
  rectangular_three_by_two_with_key:
    rows: 3
    columns: 2
    width_ratios:
    - 1.0
    - 1.0
    height_ratios:
    - 1.0
    - 1.0
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 1
      row: 0
      column: 1
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 2
      row: 1
      column: 0
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 3
      row: 1
      column: 1
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 4
      row: 2
      column: 0
      row_span: 1
      column_span: 1
    - kind: auxiliary
      auxiliary_id: shared_graphical_key
      row: 2
      column: 1
      row_span: 1
      column_span: 1
    size_role: rectangular_landscape_20x15_cm
  rectangular_left_span_two_right:
    rows: 2
    columns: 2
    width_ratios:
    - 1.35
    - 1.0
    height_ratios:
    - 1.0
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 2
      column_span: 1
    - kind: data
      panel_index: 1
      row: 0
      column: 1
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 2
      row: 1
      column: 1
      row_span: 1
      column_span: 1
    size_role: rectangular_landscape_20x15_cm
  supplementary_wide_top_two_bottom:
    rows: 2
    columns: 2
    width_ratios:
    - 1.0
    - 1.0
    height_ratios:
    - 1.2
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 2
    - kind: data
      panel_index: 1
      row: 1
      column: 0
      row_span: 1
      column_span: 1
    - kind: data
      panel_index: 2
      row: 1
      column: 1
      row_span: 1
      column_span: 1
    size_role: rectangular_landscape_20x15_cm
  portrait_single_panel:
    size_role: portrait_10x15_cm
    rows: 1
    columns: 1
    width_ratios:
    - 1.0
    height_ratios:
    - 1.0
    cells:
    - kind: data
      panel_index: 0
      row: 0
      column: 0
      row_span: 1
      column_span: 1
font_sizes_pt:
  base: 9
  axis_label: 9
  tick_label: 8
  legend: 8
  panel_label: 10
map_layout:
  shared_extent_for_comparable_maps: true
  distinguish_excluded_from_valid_zero: true
  north_arrow:
    enabled: true
    position: upper_right
  scale_bar:
    enabled: true
    length_km: 100
    unit: km
    label: 100 km
    position: lower_right
    horizontal_margin_fraction: 0.08
    vertical_margin_fraction: 0.05
  colorbar:
    position: below
    orientation: horizontal
    label_required: true
  legend:
    position: below
panel_layout:
  orientation: grid
  panel_titles: false
  panel_descriptions: false
panel_labels:
  convention: lowercase_parenthesised
  sequence_start: a
  font_weight: bold
presentation_export:
  schema: rp1-presentation-export-v1
  groups:
  - study
  - rq1
  - rq2
  - rq3
  - rq4
  renderer_identities:
  - acz_categorical_context_map
  - support_acz_map
  - acz_choropleth
  - district_choropleth
  - seasonality_lines
  - local_moran_categorical_map
  - district_seasonal_heatmap
  - district_circular_mean_timing
  - resultant_length_boxplot
  - single_trajectory_with_sen
  - grid_trajectory_with_sen
  - stacked_proportions
  - coefficient_or_plot
  - standardised_probability_pairs
  - cluster_membership_map
  - cluster_recurrence_map
  sources:
    governed_acz_geometry:
      path_pattern: data/geo/acz.shp
    long_run_spatial_rate_presentation_source:
      path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F2.csv
    seasonality_spatial_organisation_presentation_source:
      path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F3.csv
    district_seasonal_diagnostics_source:
      path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_S1.csv
    annual_trend_source:
      path_pattern: out/runs/{run_base}_pub/02_rq2_temporal_robustness/figure_data/FD_F4.csv
    cross_product_observability_presentation_source:
      path_pattern: out/runs/{run_base}_pub/03_rq3_observability/figure_data/FD_F5.csv
    supplement_s5_rq3:
      path_pattern: out/runs/{run_base}_pub/03_rq3_observability/tables/S5.csv
    cluster_membership_source:
      path_pattern: out/runs/{run_base}_sec/04_secondary_concentration/publication_sources/cluster_membership_source.csv
    cluster_recurrence_source:
      path_pattern: out/runs/{run_base}_pub/04_secondary_concentration/figure_data/FD_F6.csv
  geometry_dependencies:
    none:
      geometries: []
    acz:
      geometries:
      - acz
    district+acz:
      geometries:
      - district
      - acz
    acz+district_outline:
      geometries:
      - acz
      - district
  output:
    formats:
    - png
    - pdf
    size_role: rectangular_landscape_20x15_cm
    raster_dpi: 300
    collision_policy: error_if_output_dir_exists
    deterministic_names: true
    source_run_read_only: true
    staging_policy: temporary_sibling_then_atomic_promote
  run_family:
    required_member_suffix: _close
    publication_member_suffix: _pub
    secondary_member_suffix: _sec
    require_closeout_validation: true
  manifests:
    export_manifest: presentation_export_manifest.json
    source_inventory: presentation_export_source_inventory.csv
    output_inventory: presentation_export_output_inventory.csv
  semantic_styles:
    acz_categories:
      CZ: '#1f77b4'
      FZ: '#ff7f0e'
      GS: '#2ca02c'
      SS: '#d62728'
      TZ: '#9467bd'
    four_state_categories:
      both_zero: '#1f77b4'
      mcd64a1_positive_viirs_zero: '#ff7f0e'
      viirs_positive_mcd64a1_zero: '#2ca02c'
      both_positive: '#d62728'
  exports:
  - export_id: study_ghana_acz
    group: study
    label: Ghana agro-climatic zones
    source_identity: governed_acz_geometry
    source_path_pattern: data/geo/acz.shp
    selector:
      all_rows: true
    geometry_dependency: acz
    renderer_identity: acz_categorical_context_map
    scenario: null
    required_result_state: NONE
    output_filename: study_ghana_acz.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: categorical ACZ identity
    category_order:
      mode: explicit
      values:
      - CZ
      - FZ
      - GS
      - SS
      - TZ
    colour_semantic: 'fixed ACZ categorical palette: CZ #1f77b4; FZ #ff7f0e; GS #2ca02c; SS #d62728; TZ #9467bd'
    legend_policy:
      show: true
      position: below
    annotation_policy:
    - north arrow
    - 100 km scale bar
    - below-map legend with full ACZ names
    interpretation_boundary: Context only; no fire burden or inferential meaning.
  - export_id: study_district_support
    group: study
    label: District analytical support
    source_identity: long_run_spatial_rate_presentation_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F2.csv
    selector:
      column: panel
      equals: district_long_run_rate
    geometry_dependency: district+acz
    renderer_identity: support_acz_map
    scenario: null
    required_result_state: NONE
    output_filename: study_district_support.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: categorical support status and parent ACZ
    category_order:
      mode: explicit
      values:
      - CZ
      - FZ
      - GS
      - SS
      - TZ
    colour_semantic: ACZ categorical palette for retained districts; configured excluded hatch
    legend_policy:
      show: true
      position: below
    annotation_policy:
    - north arrow
    - 100 km scale bar
    - below-map ACZ/support legend
    interpretation_boundary: Eligibility/support map only; excluded districts are not zero-fire districts.
  - export_id: rq1_acz_long_run_rate
    group: rq1
    label: ACZ long-run mapped burned-area rate
    source_identity: long_run_spatial_rate_presentation_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F2.csv
    selector:
      column: panel
      equals: direct_acz_long_run_rate
    geometry_dependency: acz+district_outline
    renderer_identity: acz_choropleth
    scenario: null
    required_result_state: NONE
    output_filename: rq1_acz_long_run_rate.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: km² burned per 100 km² fixed BA-2001 burnable area per year
    category_order:
      mode: explicit
      values:
      - CZ
      - FZ
      - GS
      - SS
      - TZ
    colour_semantic: viridis continuous
    legend_policy:
      show: true
      position: below
    annotation_policy:
    - 'horizontal colourbar: Direct ACZ long-run BA rate (km² per 100 km² yr⁻¹)'
    - north arrow
    - 100 km scale bar
    interpretation_boundary: Direct ACZ quantities are calculated on ACZ support, not averages of district rates.
  - export_id: rq1_district_long_run_rate
    group: rq1
    label: District long-run mapped burned-area rate
    source_identity: long_run_spatial_rate_presentation_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F2.csv
    selector:
      column: panel
      equals: district_long_run_rate
    geometry_dependency: district+acz
    renderer_identity: district_choropleth
    scenario: null
    required_result_state: NONE
    output_filename: rq1_district_long_run_rate.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: km² burned per 100 km² fixed BA-2001 burnable area per year
    category_order:
      mode: deterministic
      key: unit_id
      values: []
    colour_semantic: viridis continuous + configured valid-zero/excluded semantics
    legend_policy:
      show: true
      position: below
    annotation_policy:
    - 'horizontal colourbar: District long-run BA rate (km² per 100 km² yr⁻¹)'
    - north arrow
    - 100 km scale bar
    interpretation_boundary: Descriptive mapped burned-area rate; excluded/unsupported is distinct from observed zero.
  - export_id: rq1_acz_seasonality
    group: rq1
    label: ACZ burned-area seasonality
    source_identity: seasonality_spatial_organisation_presentation_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F3.csv
    selector:
      column: panel
      equals: acz_seasonality
    geometry_dependency: none
    renderer_identity: seasonality_lines
    scenario: null
    required_result_state: NONE
    output_filename: rq1_acz_seasonality.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: mean monthly mapped burned area (km²); circular mean month; dimensionless resultant length
    category_order:
      mode: explicit
      values:
      - CZ
      - FZ
      - GS
      - SS
      - TZ
    colour_semantic: fixed ACZ categorical line palette
    legend_policy:
      show: true
      position: below
    annotation_policy:
    - months 1–12
    - legend below
    - each ACZ legend entry includes μ and R
    interpretation_boundary: Descriptive seasonality; circular timing does not imply synchronisation or causation.
  - export_id: rq1_district_departure
    group: rq1
    label: District departure from parent ACZ
    source_identity: seasonality_spatial_organisation_presentation_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F3.csv
    selector:
      column: panel
      equals: district_departure
    geometry_dependency: district+acz
    renderer_identity: district_choropleth
    scenario: null
    required_result_state: NONE
    output_filename: rq1_district_departure.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: km² per 100 km² yr⁻¹ difference (district minus parent ACZ)
    category_order:
      mode: deterministic
      key: unit_id
      values: []
    colour_semantic: coolwarm signed continuous + configured excluded semantics
    legend_policy:
      show: true
      position: below
    annotation_policy:
    - 'horizontal colourbar: District − parent-ACZ BA rate (km² per 100 km² yr⁻¹)'
    - north arrow
    - 100 km scale bar
    interpretation_boundary: Raw rate-unit difference; not a z-score, hotspot class or causal effect.
  - export_id: rq1_local_moran
    group: rq1
    label: Local Moran spatial organisation
    source_identity: seasonality_spatial_organisation_presentation_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_F3.csv
    selector:
      column: panel
      equals: local_moran
    geometry_dependency: district+acz
    renderer_identity: local_moran_categorical_map
    scenario: null
    required_result_state: NONE
    output_filename: rq1_local_moran.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: categorical HH/LL/HL/LH/NS/ISLAND
    category_order:
      mode: explicit
      values:
      - HH
      - LL
      - HL
      - LH
      - NS
      - ISLAND
    colour_semantic: configured semantic_styles.local_moran and excluded hatch
    legend_policy:
      show: false
      position: none
    annotation_policy:
    - categorical key below map
    - north arrow
    - 100 km scale bar
    interpretation_boundary: Only governed BH-supported classes are inferential; islands and excluded units remain distinct.
  - export_id: rq1_district_seasonal_heatmap
    group: rq1
    label: District seasonal heatmap
    source_identity: district_seasonal_diagnostics_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_S1.csv
    selector:
      column: record_type
      equals: monthly_share
    geometry_dependency: none
    renderer_identity: district_seasonal_heatmap
    scenario: null
    required_result_state: NONE
    output_filename: rq1_district_seasonal_heatmap.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: share of district long-run mapped burned area (0–1)
    category_order:
      mode: explicit
      values:
      - rows ordered by parent_code, circular_mean_month, unit_name; columns months 1–12
    colour_semantic: viridis continuous
    legend_policy:
      show: true
      position: below
    annotation_policy:
    - 'horizontal colourbar: Share of district long-run burned area'
    interpretation_boundary: Presentation-only ordering of governed district climatologies; no clustering or inferential ordering
      is introduced.
  - export_id: rq1_district_circular_mean_timing
    group: rq1
    label: District circular mean timing
    source_identity: district_seasonal_diagnostics_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_S1.csv
    selector:
      column: record_type
      equals: monthly_share
    geometry_dependency: none
    renderer_identity: district_circular_mean_timing
    scenario: null
    required_result_state: NONE
    output_filename: rq1_district_circular_mean_timing.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: cyclic month coordinate (0 ≡ 12)
    category_order:
      mode: explicit
      values:
      - districts ordered by parent_code, circular_mean_month, unit_name
    colour_semantic: single neutral marker colour
    legend_policy:
      show: false
      position: none
    annotation_policy:
    - x-axis uses configured circular_mean_month display convention
    - no district y labels
    interpretation_boundary: Circular mean is descriptive timing; row order is presentation-only and not a rank of fire burden.
  - export_id: rq1_district_resultant_length_by_acz
    group: rq1
    label: District seasonal concentration by ACZ
    source_identity: district_seasonal_diagnostics_source
    source_path_pattern: out/runs/{run_base}_pub/01_rq1_spatial_scale/figure_data/FD_S1.csv
    selector:
      column: record_type
      equals: monthly_share
    geometry_dependency: none
    renderer_identity: resultant_length_boxplot
    scenario: null
    required_result_state: NONE
    output_filename: rq1_district_resultant_length_by_acz.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: dimensionless mean resultant length (0–1)
    category_order:
      mode: explicit
      values:
      - CZ
      - FZ
      - GS
      - SS
      - TZ
    colour_semantic: neutral boxplot; ACZ identity carried by ordered labels
    legend_policy:
      show: false
      position: none
    annotation_policy:
    - ACZ codes on x-axis
    - resultant length on y-axis
    - fliers suppressed as in current S1 renderer
    interpretation_boundary: Resultant length measures seasonal concentration, not fire magnitude or synchronisation.
  - export_id: rq2_coastal_trend
    group: rq2
    label: Coastal Zone annual burned-area-rate trend
    source_identity: annual_trend_source
    source_path_pattern: out/runs/{run_base}_pub/02_rq2_temporal_robustness/figure_data/FD_F4.csv
    selector:
      column: parent_code
      equals: CZ
    geometry_dependency: none
    renderer_identity: single_trajectory_with_sen
    scenario: null
    required_result_state: NONE
    output_filename: rq2_coastal_trend.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: annual burned area per 100 km² fixed BA-2001 burnable area; Sen slope per year
    category_order:
      mode: explicit
      values:
      - years 2001–2024
    colour_semantic: 'observed #0072B2; Sen slope #D55E00'
    legend_policy:
      show: false
      position: none
    annotation_policy:
    - COASTAL ZONE
    - Sen slope
    - raw permutation p
    - BH q
    - no confidence interval
    interpretation_boundary: The Sen line is presentation-only anchoring of the governed slope; p/q are consumed, not recomputed;
      non-rejection is not evidence of no change.
  - export_id: rq2_forest_trend
    group: rq2
    label: Forest Zone annual burned-area-rate trend
    source_identity: annual_trend_source
    source_path_pattern: out/runs/{run_base}_pub/02_rq2_temporal_robustness/figure_data/FD_F4.csv
    selector:
      column: parent_code
      equals: FZ
    geometry_dependency: none
    renderer_identity: single_trajectory_with_sen
    scenario: null
    required_result_state: NONE
    output_filename: rq2_forest_trend.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: annual burned area per 100 km² fixed BA-2001 burnable area; Sen slope per year
    category_order:
      mode: explicit
      values:
      - years 2001–2024
    colour_semantic: 'observed #0072B2; Sen slope #D55E00'
    legend_policy:
      show: false
      position: none
    annotation_policy:
    - FOREST ZONE
    - Sen slope
    - raw permutation p
    - BH q
    - no confidence interval
    interpretation_boundary: The Sen line is presentation-only anchoring of the governed slope; p/q are consumed, not recomputed;
      non-rejection is not evidence of no change.
  - export_id: rq2_guinea_trend
    group: rq2
    label: Guinea Savannah annual burned-area-rate trend
    source_identity: annual_trend_source
    source_path_pattern: out/runs/{run_base}_pub/02_rq2_temporal_robustness/figure_data/FD_F4.csv
    selector:
      column: parent_code
      equals: GS
    geometry_dependency: none
    renderer_identity: single_trajectory_with_sen
    scenario: null
    required_result_state: NONE
    output_filename: rq2_guinea_trend.{format}
    size_role: rectangular_landscape_20x15_cm
    formats:
    - png
    - pdf
    raster_dpi: 300
    units: annual burned area per 100 km² fixed BA-2001 burnable area; Sen slope per year
    category_order:
      mode: explicit
      values:
      - years 2001–2024
    colour_semantic: 'observed #0072B2; Sen slope #D55E00'
    legend_policy:
      show: false
      position: none
