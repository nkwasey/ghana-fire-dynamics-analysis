[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghana-fire-archive"
version = "1.1.0"
description = "Config-driven NASA FIRMS standard-processing Ghana annual archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6", "pyshp>=2.3", "shapely>=2", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghana-fire-archive = "ghana_fire_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
