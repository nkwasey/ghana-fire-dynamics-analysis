[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo_data_prep_stage1"
version = "1.3.0"
description = "District-to-zone assignment and whole-district reporting boundaries"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "BSD-3-Clause"}
dependencies = [
  "geopandas>=1.0,<2", "pandas>=2.2,<4", "shapely>=2.0,<3",
  "pyproj>=3.6,<4", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "pyogrio>=0.9,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
geo-prep = "geo_data_prep.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
